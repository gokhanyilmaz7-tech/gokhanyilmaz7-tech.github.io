<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>İSG Görev ve Program | İSG Mevzuat Rehberi</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/src/styles.css" />
  <link rel="stylesheet" href="/src/program.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <style id="auth-cloak">body { display: none !important; }</style>
  </head>
<body class="program-page">
            <header class="topbar">
    <a href="/" class="back-link">&larr; Ana sayfaya dön</a>
    
    <div class="topbar-actions" style="display: flex; align-items: center; gap: 10px; margin-left: auto; margin-right: 20px;">
      <button id="btn-topbar-save" class="topbar-btn topbar-btn-save" title="Mevcut Görev Programını Kaydet">
        <span class="btn-icon">💾</span> Programı Kaydet
      </button>
      <button id="btn-topbar-archive" class="topbar-btn topbar-btn-archive" title="Kaydedilmiş Program Arşivi">
        <span class="btn-icon">📁</span> Arşiv
      </button>
    </div>

    <div class="topbar-meta">
      <span style="color: #b6c6ef; font-weight: 700; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;">Görev Programı</span>
    </div>
  </header>

  <main class="program-layout">
    
    <aside class="tasks-sidebar">
      <div class="sidebar-header">
        <h2>Görevler Aracı</h2>
        <p>Firmalarınızı ve görevlerinizi oluşturun.</p>
      </div>

      <div class="inline-task-form" id="inline-task-form">
        <label>İşyeri Ünvanı</label>
        <input type="text" id="t-unvan" placeholder="Örn: ABC A.Ş." />
        
        <label>Otomasyon Numarası</label>
        <input type="text" id="t-otomasyon" />
        
        <label>SGK Numarası</label>
        <input type="text" id="t-sgk" />
        
        <label>Dosya Numarası</label>
        <input type="text" id="t-dosya" />
        
        <label>İşyeri Adresi</label>
        <textarea id="t-adres"></textarea>
        
                <label>Geçerli Dönem</label>
        <div class="period-picker-container">
          <div class="period-select-group">
            <span class="period-label">Başlangıç:</span>
            <select id="t-start-month" class="period-select">
              <option value="0">Ocak</option>
              <option value="1">Şubat</option>
              <option value="2">Mart</option>
              <option value="3">Nisan</option>
              <option value="4">Mayıs</option>
              <option value="5">Haziran</option>
              <option value="6">Temmuz</option>
              <option value="7">Ağustos</option>
              <option value="8">Eylül</option>
              <option value="9">Ekim</option>
              <option value="10">Kasım</option>
              <option value="11" selected>Aralık</option>
            </select>
            <select id="t-start-year" class="period-select period-select-year">
              <option value="2024">2024</option>
              <option value="2025" selected>2025</option>
              <option value="2026">2026</option>
              <option value="2027">2027</option>
              <option value="2028">2028</option>
            </select>
          </div>
          <div class="period-select-group">
            <span class="period-label">Bitiş:</span>
            <select id="t-end-month" class="period-select">
              <option value="0" selected>Ocak</option>
              <option value="1">Şubat</option>
              <option value="2">Mart</option>
              <option value="3">Nisan</option>
              <option value="4">Mayıs</option>
              <option value="5">Haziran</option>
              <option value="6">Temmuz</option>
              <option value="7">Ağustos</option>
              <option value="8">Eylül</option>
              <option value="9">Ekim</option>
              <option value="10">Kasım</option>
              <option value="11">Aralık</option>
            </select>
            <select id="t-end-year" class="period-select period-select-year">
              <option value="2024">2024</option>
              <option value="2025">2025</option>
              <option value="2026" selected>2026</option>
              <option value="2027">2027</option>
              <option value="2028">2028</option>
            </select>
          </div>
        </div>

        <button class="save-task-btn-modern" id="save-task-btn">
          <span>+ Görev Listesine Ekle</span>
        </button>
      </div>
      
      <hr style="border: 0; height: 1px; background: #e1e8ed; margin: 20px 0;">

      <div class="sidebar-header">
        <h3>Kayıtlı Görevler</h3>
      </div>
      <div id="task-list" class="task-list"></div>
    </aside>


    <div class="calendar-main">
      <header class="cal-main-header">
        <div class="main-month-display">
          <h1 id="current-month-name">Ocak</h1>
          <h2 id="current-year-name">2026</h2>
        </div>
        
        <div class="mini-cals">
          <div class="mini-cal-wrapper" id="prev-month-cal">
             <!-- Rendered by JS -->
          </div>
          <div class="mini-cal-wrapper" id="next-month-cal">
             <!-- Rendered by JS -->
          </div>
        </div>
        
        <div class="cal-nav-buttons">
          <button id="btn-prev-month" class="nav-oval-btn"><span class="btn-icon">&larr;</span> Önceki Ay</button>
          <button id="btn-next-month" class="nav-oval-btn">Sonraki Ay <span class="btn-icon">&rarr;</span></button>
        </div>
      </header>
      
      <div class="main-calendar-grid" id="main-calendar-grid">
         <!-- Rendered by JS -->
      </div>
    </div>
  </main>

  

  <div id="assign-modal" class="modal-overlay hidden">
    <div class="modal modal-lg">
      <div class="modal-header-flex">
        <h3>Program Ekle</h3>
        <button id="close-assign-x" class="close-modal-x" title="Kapat">&times;</button>
      </div>
      
      <div class="form-group" style="margin-bottom: 18px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 8px;">
          <label style="margin: 0; font-size: 0.9rem; font-weight: 700; color: #1e293b;">Uygulanacak Günler</label>
          <div class="md-quick-presets">
            <button type="button" class="btn-xs" id="btn-md-all">Tümünü Seç</button>
            <button type="button" class="btn-xs" id="btn-md-weekdays">Hafta İçi</button>
            <button type="button" class="btn-xs" id="btn-md-weekends">Hafta Sonu</button>
            <button type="button" class="btn-xs" id="btn-md-clear">Temizle</button>
          </div>
        </div>
        <div id="multi-day-selector" class="multi-day-container"></div>
      </div>

      <div class="tabs">
        <button class="tab active" data-tab="from-tasks">Görev Seçi̇mi</button>
        <button class="tab" data-tab="manual-task">Manuel Eklenti̇</button>
      </div>
      
      <div class="tab-content active" id="tab-from-tasks">
        <div class="form-group">
          <label>Kayıtlı Görevlerden Seçin:</label>
          <select id="assign-task-select"></select>
        </div>
      </div>
      
      <div class="tab-content" id="tab-manual-task" style="display: none;">
        <div class="form-group">
          <label>Manuel Not / Görev:</label>
          <textarea id="assign-manual-text" rows="3" placeholder="Örn: Denetim Toplantısı..."></textarea>
        </div>
      </div>
      
      <div class="modal-actions">
        <button class="btn secondary" id="close-assign-modal">İPTAL</button>
        <button class="btn primary" id="save-assign-btn">GÜNE EKLE</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/scroll-top.js"></script>
  <script type="module" src="/src/program.js"></script>

  <!-- Archive Modal -->
  <div id="archive-modal" class="modal-overlay hidden">
    <div class="modal modal-lg">
      <div class="modal-header-flex">
        <h3>📁 Görev Programı Arşivi</h3>
        <button id="close-archive-x" class="close-modal-x" title="Kapat">&times;</button>
      </div>
      <p class="archive-subtitle">Kaydedilmiş tüm görev programlarınız burada yer alır. İstediğiniz arşiv kaydını takvime yükleyebilirsiniz.</p>
      
      <div id="archive-list" class="archive-list-container">
        <!-- Archive cards rendered by JS -->
      </div>
      
      <div class="modal-actions" style="margin-top: 20px;">
        <button id="close-archive-btn" class="nav-oval-btn" style="padding: 8px 18px;">Kapat</button>
      </div>
    </div>
  </div>

</body>
</html>
