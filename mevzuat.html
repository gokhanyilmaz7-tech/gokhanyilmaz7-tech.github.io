<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#102a43" />
  <link rel="icon" href="/mevzuat-rehberi-icon.png" type="image/png" />
    <title>Mevzuat</title>
  <link rel="manifest" href="/site.webmanifest" />
    <style id="auth-cloak">body { display: none !important; }</style>
  </head>
  <body>
    <header class="article-topbar">
      <a id="home-return" class="back-link" href="/" style="flex: 0 0 auto !important; width: fit-content !important; max-width: max-content !important; display: inline-block !important;">← Ana sayfaya dön</a>
      <span class="topbar-label" id="title" style="margin-left: auto; max-width: 60%; white-space: normal; text-align: right; text-transform: uppercase; font-size: 12px; line-height: 1.4;">Yükleniyor…</span>
    </header>
    <main class="article-layout">
      <article class="article-card">
        
        <div class="article-tools">
          <label class="article-search">
            <span aria-hidden="true">⌕</span>
            <input id="search" type="search" placeholder="Bu mevzuatta ara…" autocomplete="off" />
            <span id="result-count"></span>
          </label>
          <div class="result-actions">
            <button id="previous" type="button" title="Önceki sonuç">↑</button>
            <button id="next" type="button" title="Sonraki sonuç">↓</button>
          </div>
        </div>
        <p class="copy-tip">Metni doğrudan seçip kopyalayabilirsiniz. Word, Pages ve benzeri programlara yapıştırmaya uygundur.</p>
        <div id="content" class="article-content"><p>Mevzuat yükleniyor…</p></div>
      </article>
    </main>
    <script type="module" src="/src/section.js"></script>
  <script type="module" src="/src/scroll-top.js"></script>
  </body>
</html>
